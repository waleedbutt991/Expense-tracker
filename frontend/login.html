<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container" style="margin-top: 50px;">
    
    <!-- Install App Banner -->
    <div id="installBanner" class="install-banner">
      📲 Install App Version for fast access!
      <button id="installAppBtn" class="install-btn">Install</button>
    </div>

    <div class="card">
      <h2 id="formTitle" style="text-align: center;">Welcome Back</h2>
      
      <form id="authForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="enter email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="enter password" required>
        </div>
        <button type="submit" id="submitBtn" class="btn">Login</button>
      </form>

      <p style="text-align: center; margin-top: 15px; font-size: 14px;">
        <span id="toggleText">Don't have an account?</span>
        <a href="#" id="toggleAuth" style="color: #4f46e5; font-weight: bold; text-decoration: none;">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
