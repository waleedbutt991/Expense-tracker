<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Income Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Dashboard</h2>

        <!-- Date Filter Section -->
        <div class="card">
            <h3>📅 Filter Report By Date</h3>
            <div class="form-group-inline">
                <div>
                    <label>From Date</label>
                    <input type="date" id="fromDate">
                </div>
                <div>
                    <label>To Date</label>
                    <input type="date" id="toDate">
                </div>
            </div>
            <button class="btn-primary" onclick="applyFilter()">Apply Filter</button>
            <button class="btn-secondary" onclick="resetFilter()">Reset</button>
        </div>

        <!-- Add Income Section -->
        <div class="card">
            <h3>➕ Add Income</h3>
            <div class="form-group">
                <label>Source / Head Name</label>
                <input type="text" id="incomeHead" placeholder="salary">
            </div>
            <div class="form-group">
                <label>Amount (Rs.)</label>
                <input type="number" id="incomeAmount" placeholder="5000">
            </div>
            <button class="btn-green" onclick="saveIncome(event)">Save Income</button>
        </div>

        <!-- Add Expense Section -->
        <div class="card">
            <h3>➖ Add Expense</h3>
            <div class="form-group">
                <label>Item Name (Auto-Suggests Saved Items)</label>
                <input type="text" id="expenseItem" placeholder="Type item e.g. Milk, Ration">
            </div>
            <div class="form-group">
                <label>Amount (Rs.)</label>
                <input type="number" id="expenseAmount" placeholder="0.00">
            </div>
            <button class="btn-red" onclick="saveExpense(event)">Save Expense</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
